<div class="app-container">
  <header class="navbar">
    <div class="navbar-content">
      <a
        class="brand"
        href="#"
        (click)="$event.preventDefault(); irPara('lista')"
      >
        <span class="brand-mark">✓</span
        ><span
          >task<span class="brand-light">flow</span
          ><small>GESTÃO SIMPLES, DIA PRODUTIVO</small></span
        >
      </a>
      <nav class="nav-links" aria-label="Navegação principal">
        <button
          (click)="irPara('lista')"
          [ngClass]="{ active: paginaAtual === 'lista' }"
          class="nav-btn"
        >
          <span>▤</span> Minhas tarefas
        </button>
        <button
          (click)="irPara('cadastro')"
          [ngClass]="{ active: paginaAtual === 'cadastro' }"
          class="nav-btn nav-primary"
        >
          <span>＋</span> Nova tarefa
        </button>
      </nav>
    </div>
  </header>
  <main class="main-content">
    <app-lista-tarefas *ngIf="paginaAtual === 'lista'"></app-lista-tarefas>
    <app-cadastro-tarefa
      *ngIf="paginaAtual === 'cadastro'"
    ></app-cadastro-tarefa>
  </main>
  <footer class="footer">
    <span>taskflow</span><span>Um passo de cada vez.</span><span>© 2026</span>
  </footer>
</div>
